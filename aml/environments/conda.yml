name: rti-training
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=23
  # mlflow 2.15.1 still does 'import pkg_resources', which ships with setuptools.
  # Recent conda-forge python builds no longer pull setuptools in, and setuptools 81
  # dropped pkg_resources - so it has to be requested explicitly AND capped.
  - setuptools<81
  - pip:
      # Versions are pinned on purpose. The SAME environment is reused for the
      # online deployment in P5, and a scoring container that unpickles a model
      # built against a different scikit-learn / numpy / cloudpickle will either
      # warn or fail outright. Pinning here is what makes P5 boring.
      - numpy==1.26.4
      - pandas==2.2.2
      # mlflow 2.15.1 requires pyarrow<16, so 16.1.0 made pip unsolvable.
      # The pin stays explicit rather than loose: this file is the contract
      # between the container that pickles the model and the one that unpickles it.
      - pyarrow==15.0.2
      - scikit-learn==1.5.2
      - cloudpickle==3.0.0
      - mlflow==2.15.1
      - azureml-mlflow
