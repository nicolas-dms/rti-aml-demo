# Manual agent smoke test. No Azure service connection or resource changes.
trigger: none
pr: none

pool:
  name: rti-mlops-local

jobs:
- job: AgentSmokeTest
  displayName: Verify local agent and checkout
  timeoutInMinutes: 10
  steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - powershell: |
      $ErrorActionPreference = 'Stop'
      Write-Host "Agent: $env:AGENT_NAME"
      Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
      Write-Host "Build: $env:BUILD_BUILDID"
      Write-Host "Commit: $env:BUILD_SOURCEVERSION"

      git --version
      if ($LASTEXITCODE -ne 0) { throw 'Git version check failed.' }
      $sha = git rev-parse HEAD
      if ($LASTEXITCODE -ne 0) { throw 'Git checkout check failed.' }
      if ($sha.Trim() -ne $env:BUILD_SOURCEVERSION) {
          throw 'Checkout does not match the pipeline source commit.'
      }
      Write-Host 'Checkout matches the pipeline source commit.'

      $missing = @()
      foreach ($tool in @('git', 'pwsh', 'az', 'python')) {
          $command = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $command) {
              Write-Host "##vso[task.logissue type=error]Missing tool in agent PATH: $tool"
              $missing += $tool
          } else {
              Write-Host "Available: $tool ($($command.Source))"
          }
      }
      if ($missing.Count -gt 0) {
          throw 'Install missing prerequisites, restart the interactive agent, then rerun.'
      }
      Write-Host 'Agent smoke test passed. Azure authentication was not tested.'
    displayName: Verify checkout and required tools